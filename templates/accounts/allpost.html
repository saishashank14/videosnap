<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Posts</title>
</head>
<body>

    <header>
        <h1>All Posts</h1>
        <hr>
    </header>

    <main>

        {% for post in posts_all %}
        <article>
            <h2>{{ post.title_coloum }}</h2>
            <p>{{ post.content_coloum }}</p>
            
            {% for image_obj in post.images.all %}
                <div style="margin: 10px 0;">
                    <img src="{{ image_obj.image.url }}" alt="{{ post.title_coloum }}" style="max-width: 100%; height: auto; border-radius: 8px;">
                </div>
            {% endfor %}
            <p><small>Posted on: {{ post.created_at }}</small></p>
        </article>
        <hr>
        {% empty %}
        <p>No posts yet. <a href="{% url 'create_post' %}">Create one!</a></p>
        {% endfor %}

    </main>

    <footer>
        <hr>
        <p>&copy; 2026 My Blog</p>
    </footer>

</body>
</html>
